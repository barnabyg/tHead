name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    # Includes cold tool preparation, the bounded browser suite, audits and teardown.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.7'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm.cmd ci --ignore-scripts
        shell: pwsh
      - run: npx.cmd playwright install chromium
        shell: pwsh
      - run: uv run --locked python scripts/prepare_voice_media.py
        shell: pwsh
      - run: uv run --locked python scripts/verify.py
        shell: pwsh
